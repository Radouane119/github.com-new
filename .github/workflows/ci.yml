name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check generated index.html is up to date
        run: node build.mjs --check
      - name: Verify HTML guardrails
        run: node scripts/verify-html.mjs
      - name: Run tests
        run: node test/dashboard.test.js
